name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libncurses-dev
      - name: Build the quest and the standalone games
        run: |
          make
          make -C connect4
          make -C worm
          c++ -std=c++17 -Wall -Wextra -Werror -o 15_puzzle/p15 15_puzzle/15Puzzle.cpp
